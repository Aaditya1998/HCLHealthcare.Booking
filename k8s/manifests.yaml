apiVersion: apps/v1
kind: Deployment
metadata:
  name: hclbooking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hclbooking
  template:
    metadata:
      labels:
        app: hclbooking
    spec:
      containers:
      - name: hclbooking
        image: hclbooking:latest # Will be replaced by CI/CD
        ports:
        - containerPort: 8080
        env:
        - name: ConnectionStrings__DefaultConnection
          value: "Server=tcp:sql-hcl-booking-782c2ba9.database.windows.net,1433;Initial Catalog=HCLHealthcareBooking;Persist Security Info=False;User ID=sqladmin;Password=***REMOVED***;MultipleActiveResultSets=False;Encrypt=True;TrustServerCertificate=False;Connection Timeout=30;"
---
apiVersion: v1
kind: Service
metadata:
  name: hclbooking-service
  annotations:
    service.beta.kubernetes.io/azure-dns-label-name: hclbooking-782c2ba9
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8080
  selector:
    app: hclbooking
