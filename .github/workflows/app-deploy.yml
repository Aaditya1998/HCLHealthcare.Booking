name: App Build & Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build & Push to ACR
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/hclbooking:${{ github.sha }}
          file: ./Dockerfile
  
  deploy-to-aks:
    needs: build-and-push
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      
      - uses: azure/aks-set-context@v3
        with:
          cluster-name: aks-hcl-booking
          resource-group: rg-hcl-booking
      
      - name: Deploy to K8s
        run: |
          kubectl set image deployment/hclbooking hclbooking=${{ secrets.ACR_LOGIN_SERVER }}/hclbooking:${{ github.sha }}
