name: Infrastructure Deployment
on:
  push:
    paths: ['terraform/**']
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: production
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_sql_password: ${{ secrets.SQL_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v3
      
      - name: Azure Login (OIDC)
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get SP Object ID
        id: get-sp
        run: |
          sp_id=$(az ad sp show --id ${{ secrets.AZURE_CLIENT_ID }} --query id -o tsv)
          echo "::add-mask::$sp_id"
          echo "sp_id=$sp_id" >> $GITHUB_OUTPUT

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_wrapper: false

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.AZURE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ secrets.AZURE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ secrets.AZURE_STORAGE_CONTAINER }}" \
            -backend-config="key=${{ secrets.AZURE_STORAGE_KEY }}"
        working-directory: ./terraform
      
      - name: Terraform Plan
        env:
          TF_VAR_admin_object_id: ${{ steps.get-sp.outputs.sp_id }}
        run: terraform plan -out=tfplan
        working-directory: ./terraform
      
      - name: Terraform Apply
        env:
          TF_VAR_admin_object_id: ${{ steps.get-sp.outputs.sp_id }}
        run: terraform apply -auto-approve tfplan
        working-directory: ./terraform
